<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #5b4bdb, #8c7cff);
        }

        .login-box {
            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .login-box h1 {
            text-align: center;

            color: #5b4bdb;

            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        .input-group input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 16px;
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            background: #5b4bdb;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #4839c5;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #5b4bdb;

            text-decoration: none;
        }

        #message {
            text-align: center;

            margin-top: 15px;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>Teja's Blog</h1>

        <p>Admin Dashboard Login</p>


        <form id="loginForm">

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="login-btn">
                Login to Dashboard
            </button>

        </form>


        <p id="message"></p>


        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                if (
                    email === "chinthakayalateja5@gmail.com" &&
                    password === "1011"
                ) {

                    window.location.href = "dashboard.html";

                } else {

                    document.getElementById("message").textContent =
                        "Invalid email or password";

                    document.getElementById("message").style.color =
                        "red";

                }

            });

    </script>

</body>

</html>
